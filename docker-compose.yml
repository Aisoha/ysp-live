services:
  ysp-live:
    image: ysp-live:9.6
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ysp-live-v9.6
    restart: unless-stopped
    network_mode: host
    dns:
      - 223.5.5.5
      - 119.29.29.29
      - 1.1.1.1
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - YSP_DATA_DIR=/app/data
      - YSP_ZAP_DEBOUNCE=1.5
      - NODE_OPTIONS=--max-old-space-size=256 --optimize-for-size
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
