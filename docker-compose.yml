version: '3.8'

services:
  ysp-live:
    build:
      context: .
      dockerfile: Dockerfile
    image: ysp-live:9.5.1
    container_name: ysp-live
    restart: always
    network_mode: "host"
    environment:
      - TZ=Asia/Shanghai
      - NODE_OPTIONS="--max-old-space-size=256 --optimize-for-size"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"